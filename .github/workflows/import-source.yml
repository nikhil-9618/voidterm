name: Import VOIDTERM source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, and import source
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 'https://d.uguu.se/wcKQLXuu.tar.gz' -o /tmp/voidterm-source.tar.gz
          echo '1f1d7870822202706c1b528da37feb885e3dca1932391fc718520a911fea5855  /tmp/voidterm-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/voidterm-source.tar.gz -C .
          rm -f .github/workflows/import-source.yml
          git config user.name 'VOIDTERM import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already imported.'
            exit 0
          fi
          git commit -m 'Import hardened VOIDTERM source'
          git push
