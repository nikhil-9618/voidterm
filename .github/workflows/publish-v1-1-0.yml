name: Publish Android 1.1.0
on:
  push:
    paths:
      - '.github/workflows/publish-v1-1-0.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with verified APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="VOIDTERM 1.1.0 for Android.

          - Native-feeling mobile shell with edge-swipe recent conversations
          - Hardware back closes the recents drawer or dialogs before navigating
          - In-app update check against GitHub Releases
          - Same private account and conversations as the web app

          Install: download the APK and open it on your device."
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 public/downloads/VOIDTERM-1.1.0.apk --clobber
          else
            gh release create v1.1.0 public/downloads/VOIDTERM-1.1.0.apk \
              --target 8fa45ea8aa46aa0f4f57d7073bf28609dcca616c \
              --title "VOIDTERM 1.1.0" \
              --notes "$NOTES" \
              --latest
          fi
      - name: Remove one-off workflow
        shell: bash
        run: |
          git config user.name "voidterm-release-bot"
          git config user.email "bot@voidterm.app"
          git rm --quiet .github/workflows/publish-v1-1-0.yml
          git commit -m "chore: remove one-off Android release workflow"
          git push
