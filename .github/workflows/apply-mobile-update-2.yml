name: Apply mobile app payload
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-update-2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and apply payload
        run: |
          curl -fsSL https://files.catbox.moe/blxcyt.gz -o /tmp/update.tar.gz
          tar -xzf /tmp/update.tar.gz
      - name: Commit payload
        shell: bash
        run: |
          git config user.name "voidterm-release-bot"
          git config user.email "bot@voidterm.app"
          git add -A
          git rm --quiet .github/workflows/apply-mobile-update-2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: native-feeling Android app, swipe recents, and releases"
          git push
